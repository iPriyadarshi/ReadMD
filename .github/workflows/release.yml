name: Build and Publish Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Keep the R8 mapping file
        # Needed to read crash reports from this build; see "Crash reports" in the README.
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Rename release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Expected release APK not found: $APK"
            echo "Available APK files:"
            find app/build/outputs/apk -type f -name '*.apk' || true
            exit 1
          fi

          mv "$APK" ReadMD.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            SDK="$HOME/Android/Sdk"
          fi

          if [ ! -d "$SDK/build-tools" ]; then
            echo "Android SDK build-tools not found."
            echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"
            exit 1
          fi

          APK_SIGNER="$(find "$SDK/build-tools" \
            -type f -name apksigner -print | sort -V | tail -n 1)"

          if [ -z "$APK_SIGNER" ]; then
            echo "apksigner was not found"
            exit 1
          fi

          "$APK_SIGNER" verify --verbose ReadMD.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ReadMD ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ReadMD.apk
